name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surety/contracts install:std
      - run: pnpm test:contracts
      - run: pnpm typecheck
      - run: pnpm --filter @surety/web lint
      - run: pnpm build
